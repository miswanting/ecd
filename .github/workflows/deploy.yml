name: Deploy GitHub Pages

on:
  push:
    branches:
      - dev

jobs:
  ubuntu-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1

      - name: Try Checkout Github Pages Branch
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: "gh-pages"

      - name: Checkout Documentation Branch
        uses: actions/checkout@v7
        with:
          ref: "dev"
          path: "documentation"

      - name: Build Document
        run: |
          cd documentation
          pnpm i
          # 当前线上由 VitePress 构建（并行迁移中）。
          # 需要回退到 VuePress 时，把下面两行换回：
          #   pnpm run docs:build
          #   mv documentation/docs/.vuepress/dist dist
          pnpm run docs:build:vp
          cd ..
          mv documentation/docs/.vitepress/dist dist
          rm -r documentation

      - name: Try Delete Old Version
        continue-on-error: true
        run: |
          rm -r docs

      - name: Rename
        run: |
          mv dist docs

      - name: Push
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.key }}
          push-branch: "gh-pages"
          commit-message: "Auto Generate & Deploy"
          force-add: "true"
          files: ./*
          name: Miswanting
          email: ihex@foxmail.com
