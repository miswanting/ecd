# Emuera (EraBasic) TextMate grammar.
# Syntax reference: Emuera C# sources (GameData/, GameProc/, Sub/).
# Repository: https://github.com/miswanting/ecd
$schema: "https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json"
name: "EraBasic"
scopeName: "source.erb"
patterns:
  - include: "#preprocessor"
  - include: "#statement"
  - include: "#expression"
repository:
  preprocessor:
    patterns:
      - include: "#line-continuation"
      - include: "#rename"
      - include: "#preprocessor-block"
      - include: "#preprocessor-special-comment"
      - include: "#preprocessor-directive"
  "line-continuation":
    begin: "^\\s*\\{\\s*$"
    beginCaptures:
      "0":
        name: "meta.preprocessor.line-continuation.erabasic"
    end: "^\\s*\\}\\s*$"
    endCaptures:
      "0":
        name: "meta.preprocessor.line-continuation.erabasic"
    patterns:
      - include: "#comment"
      - include: "#statement"
      - include: "#expression"
  rename:
    patterns:
      -
        name: "meta.rename.erabasic"
        match: "\\[\\[[^\\]\\n]*\\]\\]"
  "preprocessor-block":
    patterns:
      -
        name: "comment.block.erabasic"
        begin: "(?:^|(?<=;))[ \\t]*\\[((?i:SKIPSTART))\\s*\\]"
        beginCaptures:
          "0":
            name: "meta.preprocessor.erabasic"
          "1":
            name: "keyword.control.directive.erabasic"
        end: "(?:^|(?<=;))[ \\t]*\\[((?i:SKIPEND))\\s*\\]"
        endCaptures:
          "0":
            name: "meta.preprocessor.erabasic"
          "1":
            name: "keyword.control.directive.erabasic"
      -
        match: "(?:^|(?<=;))[ \\t]*\\[((?i:IF|ELSEIF))\\s+([^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e]+)\\s*\\]"
        captures:
          "0":
            name: "meta.preprocessor.erabasic"
          "1":
            name: "keyword.control.directive.erabasic"
          "2":
            name: "variable.other.macro.erabasic"
      -
        match: "(?:^|(?<=;))[ \\t]*\\[((?i:IF_DEBUG|IF_NDEBUG|ELSE|ENDIF))\\s*\\]"
        captures:
          "0":
            name: "meta.preprocessor.erabasic"
          "1":
            name: "keyword.control.directive.erabasic"
  "preprocessor-special-comment":
    patterns:
      -
        begin: "^\\s*;[!#];"
        beginCaptures:
          "0":
            name: "meta.preprocessor.erabasic"
        end: "$"
        patterns:
          - include: "#preprocessor"
          - include: "#statement"
          - include: "#expression"
  "preprocessor-directive":
    patterns:
      -
        match: "(?:^|(?<=;))[ \\t]*#((?i:DEFINE))\\s+([^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e]+)"
        name: "meta.preprocessor.erabasic"
        captures:
          "1":
            name: "keyword.control.directive.erabasic"
          "2":
            name: "entity.name.function.macro.erabasic"
      -
        match: "(?:^|(?<=;))[ \\t]*#((?i:DIM|DIMS))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])(\\s+)((?:(?i:CONST|REF|DYNAMIC|STATIC|GLOBAL|SAVEDATA|CHARADATA)(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])\\s+)*)([^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e]+)"
        name: "meta.preprocessor.erabasic"
        captures:
          "1":
            name: "keyword.control.directive.erabasic"
          "3":
            patterns:
              -
                name: "storage.modifier.erabasic"
                match: "(?i:CONST|REF|DYNAMIC|STATIC|GLOBAL|SAVEDATA|CHARADATA)(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
          "4":
            name: "entity.name.variable.erabasic"
      -
        match: "(?:^|(?<=;))[ \\t]*#((?i:FUNCTION|FUNCTIONS|SINGLE|PRI|LATER|ONLY|LOCALSIZE|LOCALSSIZE))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        name: "meta.preprocessor.erabasic"
        captures:
          "1":
            name: "keyword.control.directive.erabasic"
  statement:
    patterns:
      - include: "#comment"
      - include: "#prefix-operator"
      - include: "#function-declaration"
      - include: "#labeled-statement"
      - include: "#control-statement"
      - include: "#form-call-statement"
      - include: "#call-statement"
      - include: "#form-command-statement"
      - include: "#print-command-statement"
      - include: "#input-command-statement"
      - include: "#command-statement"
      - include: "#assignment-statement"
  comment:
    patterns:
      -
        name: "comment.line.semicolon.erabasic"
        begin: ";"
        beginCaptures:
          "0":
            name: "punctuation.definition.comment.erabasic"
        end: "$"
  "prefix-operator":
    patterns:
      -
        name: "keyword.operator.increment.erabasic"
        match: "(?:^|(?<=;))[ \\t]*(\\+\\+)"
      -
        name: "keyword.operator.decrement.erabasic"
        match: "(?:^|(?<=;))[ \\t]*(--)"
  "function-declaration":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*@(?:((?i:EVENTFIRST|EVENTTRAIN|EVENTSHOP|EVENTBUY|EVENTCOM|EVENTTURNEND|EVENTCOMEND|EVENTEND|EVENTLOAD))|((?i:SHOW_STATUS|SHOW_USERCOM|USERCOM|SOURCE_CHECK|CALLTRAINEND|SHOW_JUEL|SHOW_ABLUP_SELECT|USERABLUP|SHOW_SHOP|SAVEINFO|USERSHOP|TITLE_LOADGAME|SYSTEM_AUTOSAVE|SYSTEM_TITLE|SYSTEM_LOADEND)|(?i:(?:COM|COM_ABLE|ABLUP))[0-9]+))"
        beginCaptures:
          "1":
            name: "entity.name.function.event.erabasic"
          "2":
            name: "entity.name.function.system.erabasic"
        end: "$"
        patterns:
          - include: "#function-declaration-arguments"
      -
        begin: "(?:^|(?<=;))[ \\t]*@([^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e]+)"
        beginCaptures:
          "1":
            name: "entity.name.function.erabasic"
        end: "$"
        patterns:
          - include: "#function-declaration-arguments"
  "function-declaration-arguments":
    patterns:
      -
        begin: "\\["
        beginCaptures:
          "0":
            name: "punctuation.section.brackets.begin.erabasic"
        end: "(\\])|$"
        endCaptures:
          "1":
            name: "punctuation.section.brackets.end.erabasic"
        patterns:
          - include: "#expression"
      - include: "#expression"
  "labeled-statement":
    patterns:
      -
        match: "(?:^|(?<=;))[ \\t]*\\$([^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e]+)"
        captures:
          "1":
            name: "entity.name.label.erabasic"
  "control-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:CASE))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        beginCaptures:
          "1":
            name: "keyword.control.erabasic"
        end: "$"
        patterns:
          -
            name: "keyword.other.case.erabasic"
            match: "(?<![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])(?i:IS|TO)(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
          - include: "#expression"
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:(?:STOPCALLTRAIN|PRINTDATADL|PRINTDATADW|PRINTDATAKL|PRINTDATAKW|TRYCALLLIST|TRYGOTOLIST|TRYJUMPLIST|PRINTDATAD|PRINTDATAK|PRINTDATAL|PRINTDATAW|SELECTCASE|CALLTRAIN|ENDNOSKIP|ENDSELECT|PRINTDATA|RANDOMIZE|CASEELSE|CONTINUE|DATALIST|DUMPRAND|ENDCATCH|INITRAND|TRYCGOTO|DOTRAIN|ENDDATA|ENDFUNC|ENDLIST|RESTART|RETURNF|STRDATA|TRYGOTO|ELSEIF|NOSKIP|REPEAT|RETURN|BEGIN|BREAK|CATCH|ENDIF|WHILE|DATA|ELSE|GOTO|LOOP|NEXT|REND|WEND|FOR|SIF|DO|IF)))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        beginCaptures:
          "1":
            name: "keyword.control.erabasic"
        end: "$"
        patterns:
          - include: "#expression"
  "form-command-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:(?:PRINTSINGLEFORMSD|PRINTSINGLEFORMSK|PRINTSINGLEFORMD|PRINTSINGLEFORMK|PRINTSINGLEFORMS|DEBUGPRINTFORML|PRINTSINGLEFORM|DEBUGPRINTFORM|PRINTPLAINFORM|DRAWLINEFORM|PRINTFORMSDL|PRINTFORMSDW|PRINTFORMSKL|PRINTFORMSKW|TRYCGOTOFORM|ENCODETOUNI|PRINTFORMDL|PRINTFORMDW|PRINTFORMKL|PRINTFORMKW|PRINTFORMSD|PRINTFORMSK|PRINTFORMSL|PRINTFORMSW|STRLENFORMU|TRYGOTOFORM|PRINTFORMD|PRINTFORMK|PRINTFORML|PRINTFORMS|PRINTFORMW|RETURNFORM|STRLENFORM|ONEINPUTS|PRINTFORM|DATAFORM|GOTOFORM|PUTFORM|INPUTS|THROW)))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        beginCaptures:
          "1":
            name: "keyword.other.command.form.erabasic"
        end: "$"
        patterns:
          - include: "#form-string"
  "form-call-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:(?:TRYCCALLFORM|TRYCJUMPFORM|TRYCALLFORM|TRYJUMPFORM|CALLFORMF|CALLFORM|JUMPFORM|FUNC)))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        beginCaptures:
          "1":
            name: "keyword.control.call.form.erabasic"
        end: "$"
        patterns:
          - include: "#form-string-call"
          -
            begin: "(?=[,\\[(])"
            end: "$"
            patterns:
              - include: "#square-brackets"
              - include: "#expression"
  "call-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:(?:CALLEVENT|TRYCCALL|TRYCJUMP|TRYCALL|TRYJUMP|CALLF|CALL|JUMP)))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])\\s+([^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e]+)"
        beginCaptures:
          "1":
            name: "keyword.control.call.erabasic"
          "2":
            name: "entity.name.function.erabasic"
        end: "$"
        patterns:
          - include: "#expression"
  "print-command-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:(?:PRINTSINGLEFORMSD|PRINTSINGLEFORMSK|PRINTSINGLEFORMD|PRINTSINGLEFORMK|PRINTSINGLEFORMS|SETBGCOLORBYNAME|PRINTSINGLEFORM|CUSTOMDRAWLINE|PRINTPLAINFORM|PRINT_SHOPITEM|SETCOLORBYNAME|PRINTBUTTONLC|PRINTCPERLINE|PRINTSINGLESD|PRINTSINGLESK|PRINTSINGLEVD|PRINTSINGLEVK|REUSELASTLINE|PRINTBUTTONC|PRINTFORMLCD|PRINTFORMLCK|PRINTFORMSDL|PRINTFORMSDW|PRINTFORMSKL|PRINTFORMSKW|PRINTSINGLED|PRINTSINGLEK|PRINTSINGLES|PRINTSINGLEV|PRINT_TALENT|RESETBGCOLOR|FONTREGULAR|PRINTBUTTON|PRINTDATADL|PRINTDATADW|PRINTDATAKL|PRINTDATAKW|PRINTFORMCD|PRINTFORMCK|PRINTFORMDL|PRINTFORMDW|PRINTFORMKL|PRINTFORMKW|PRINTFORMLC|PRINTFORMSD|PRINTFORMSK|PRINTFORMSL|PRINTFORMSW|PRINTSINGLE|PRINT_PALAM|PRINT_SPACE|DEBUGCLEAR|FONTITALIC|HTML_PRINT|PRINTDATAD|PRINTDATAK|PRINTDATAL|PRINTDATAW|PRINTFORMC|PRINTFORMD|PRINTFORMK|PRINTFORML|PRINTFORMS|PRINTFORMW|PRINTPLAIN|PRINT_ITEM|PRINT_MARK|PRINT_RECT|RESETCOLOR|SETBGCOLOR|ALIGNMENT|CLEARLINE|FONTSTYLE|PRINTDATA|PRINTFORM|PRINT_ABL|PRINT_EXP|PRINT_IMG|CUPCHECK|DRAWLINE|FONTBOLD|PRINTLCD|PRINTLCK|PRINTSDL|PRINTSDW|PRINTSKL|PRINTSKW|PRINTVDL|PRINTVDW|PRINTVKL|PRINTVKW|SETCOLOR|PRINTCD|PRINTCK|PRINTDL|PRINTDW|PRINTKL|PRINTKW|PRINTLC|PRINTSD|PRINTSK|PRINTSL|PRINTSW|PRINTVD|PRINTVK|PRINTVL|PRINTVW|SETFONT|STRLENU|UPCHECK|PRINTC|PRINTD|PRINTK|PRINTL|PRINTS|PRINTV|PRINTW|REDRAW|STRLEN|PRINT|TIMES|BARL|BAR)))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        beginCaptures:
          "1":
            name: "keyword.other.command.print.erabasic"
        end: "$"
        patterns:
          - include: "#single-quoted-string"
          - include: "#expression"
  "input-command-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:(?:INPUTMOUSEKEY|TONEINPUTS|WAITANYKEY|FORCEWAIT|TONEINPUT|ONEINPUT|TINPUTS|TINPUT|AWAIT|INPUT|TWAIT|WAIT)))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        beginCaptures:
          "1":
            name: "keyword.other.command.input.erabasic"
        end: "$"
        patterns:
          - include: "#single-quoted-string"
          - include: "#expression"
  "command-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*((?i:(?:TOOLTIP_SETDURATION|TOOLTIP_SETCOLOR|TOOLTIP_SETDELAY|HTML_TAGSPLIT|ADDCOPYCHARA|ADDVOIDCHARA|CLEARTEXTBOX|ADDDEFCHARA|ARRAYREMOVE|DEBUGPRINTL|DELALLCHARA|PICKUPCHARA|RESETGLOBAL|RESET_STAIN|ADDSPCHARA|ARRAYSHIFT|DEBUGPRINT|LOADGLOBAL|SAVEGLOBAL|ARRAYCOPY|ARRAYSORT|COPYCHARA|FORCEKANA|INVERTBIT|LOADCHARA|OUTPUTLOG|REFBYNAME|RESETDATA|SAVECHARA|SORTCHARA|SWAPCHARA|ADDCHARA|CLEARBIT|DELCHARA|LOADDATA|LOADGAME|SAVEDATA|SAVEGAME|SKIPDISP|CVARSET|DELDATA|GETTIME|LOADVAR|SAVENOS|SAVEVAR|VARSIZE|ASSERT|SETBIT|VARSET|POWER|SPLIT|CASE|QUIT|SWAP|REF)))(?![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])"
        beginCaptures:
          "1":
            name: "keyword.other.command.erabasic"
        end: "$"
        patterns:
          - include: "#expression"
  "assignment-statement":
    patterns:
      -
        begin: "(?:^|(?<=;))[ \\t]*(?=[^;]*?(?:'=|<<=|>>=|\\+=|-=|\\*=|/=|%=|\\|=|&=|\\^=|==|=(?!=)))"
        end: "$"
        patterns:
          -
            name: "keyword.operator.assignment.erabasic"
            match: "(?:'=|<<=|>>=|\\+=|-=|\\*=|/=|%=|\\|=|&=|\\^=|==|=(?!=))"
          - include: "#form-string"
          - include: "#expression"
  "form-string":
    patterns:
      - include: "#string-conditional-operator"
      - include: "#triple-symbol"
      - include: "#string-placeholder"
      - include: "#numeric-placeholder"
      - include: "#escape-sequence"
  "form-string-call":
    patterns:
      - include: "#string-conditional-operator"
      - include: "#triple-symbol"
      - include: "#string-placeholder"
      - include: "#numeric-placeholder"
      - include: "#escape-sequence"
  "string-conditional-operator":
    patterns:
      -
        name: "meta.template.expression.erabasic"
        match: "(\\\\@)(.*?)(\\?)(.*?)(#)(.*?)(\\\\@)"
        captures:
          "1":
            name: "keyword.other.placeholder.erabasic"
          "2":
            patterns:
              - include: "#expression"
          "3":
            name: "keyword.operator.ternary.erabasic"
          "4":
            patterns:
              - include: "#form-string"
          "5":
            name: "keyword.operator.ternary.erabasic"
          "6":
            patterns:
              - include: "#form-string"
          "7":
            name: "keyword.other.placeholder.erabasic"
  "triple-symbol":
    patterns:
      -
        name: "constant.other.symbol.erabasic"
        match: "\\*\\*\\*|\\+\\+\\+|===|///|\\$\\$\\$"
  "escape-sequence":
    patterns:
      -
        name: "constant.character.escape.erabasic"
        match: "\\\\."
  "string-placeholder":
    patterns:
      -
        name: "meta.template.expression.erabasic"
        begin: "(?<!\\\\)%(?=[^%\\n]*%)"
        beginCaptures:
          "0":
            name: "keyword.other.placeholder.erabasic"
        end: "(%)|$"
        endCaptures:
          "1":
            name: "keyword.other.placeholder.erabasic"
        patterns:
          - include: "#expression"
  "numeric-placeholder":
    patterns:
      -
        name: "meta.template.expression.erabasic"
        begin: "(?<!\\\\)\\{(?=[^{}\\n]*\\})"
        beginCaptures:
          "0":
            name: "keyword.other.placeholder.erabasic"
        end: "(})|$"
        endCaptures:
          "1":
            name: "keyword.other.placeholder.erabasic"
        patterns:
          - include: "#expression"
  expression:
    patterns:
      - include: "#comment"
      - include: "#round-braces"
      - include: "#operators"
      - include: "#string-literal"
      - include: "#formatted-string"
      - include: "#numeric-literal"
      - include: "#function-call"
      - include: "#predefined-variables"
      - include: "#label-reference"
      - include: "#identifier"
      - include: "#punctuation"
  "round-braces":
    patterns:
      -
        begin: "\\("
        beginCaptures:
          "0":
            name: "punctuation.parenthesis.open.erabasic"
        end: "(\\))|$"
        endCaptures:
          "1":
            name: "punctuation.parenthesis.close.erabasic"
        patterns:
          - include: "#expression"
  "square-brackets":
    patterns:
      -
        begin: "\\["
        beginCaptures:
          "0":
            name: "punctuation.section.brackets.begin.erabasic"
        end: "(\\])|$"
        endCaptures:
          "1":
            name: "punctuation.section.brackets.end.erabasic"
        patterns:
          - include: "#expression"
  operators:
    patterns:
      -
        name: "keyword.operator.shift.erabasic"
        match: "<<|>>"
      -
        name: "keyword.operator.comparison.erabasic"
        match: "==|!=|<=|>=|<|>"
      -
        name: "keyword.operator.logical.erabasic"
        match: "&&|\\|\\||\\^\\^|!&|!\\||!"
      -
        name: "keyword.operator.bitwise.erabasic"
        match: "~|&|\\||\\^"
      -
        name: "keyword.operator.increment.erabasic"
        match: "\\+\\+"
      -
        name: "keyword.operator.decrement.erabasic"
        match: "--"
      -
        name: "keyword.operator.arithmetic.erabasic"
        match: "\\*|/|%|\\+|-"
      -
        name: "keyword.operator.ternary.erabasic"
        match: "\\?|#"
      -
        name: "keyword.operator.assignment.erabasic"
        match: "="
      -
        name: "keyword.operator.subscript.erabasic"
        match: ":"
  "string-literal":
    patterns:
      -
        name: "string.quoted.double.erabasic"
        begin: "\""
        beginCaptures:
          "0":
            name: "punctuation.definition.string.begin.erabasic"
        end: "(\")|$"
        endCaptures:
          "1":
            name: "punctuation.definition.string.end.erabasic"
        patterns:
          - include: "#escape-sequence"
  "formatted-string":
    patterns:
      -
        name: "string.quoted.double.formatted.erabasic"
        begin: "@\""
        beginCaptures:
          "0":
            name: "punctuation.definition.string.begin.erabasic"
        end: "(\")|$"
        endCaptures:
          "1":
            name: "punctuation.definition.string.end.erabasic"
        patterns:
          - include: "#form-string"
  "single-quoted-string":
    patterns:
      -
        name: "string.quoted.single.erabasic"
        begin: "'"
        beginCaptures:
          "0":
            name: "punctuation.definition.string.begin.erabasic"
        end: "(')|$"
        endCaptures:
          "1":
            name: "punctuation.definition.string.end.erabasic"
        patterns:
          - include: "#escape-sequence"
  "numeric-literal":
    patterns:
      -
        name: "constant.numeric.hex.erabasic"
        match: "(?<![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])0[xX][0-9a-fA-F]+"
      -
        name: "constant.numeric.binary.erabasic"
        match: "(?<![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])0[bB][01]+"
      -
        name: "constant.numeric.float.erabasic"
        match: "(?<![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])[0-9]+\\.[0-9]+"
      -
        name: "constant.numeric.exponent.erabasic"
        match: "(?<![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])[0-9]+[eEpP][+-]?[0-9]+"
      -
        name: "constant.numeric.erabasic"
        match: "(?<![^\\s\\x21-\\x2f\\x3a-\\x40\\x5b-\\x5e\\x7b-\\x7e])[0-9]+"
  "function-call":
    patterns:
      -
