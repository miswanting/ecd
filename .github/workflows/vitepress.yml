name: VitePress Build Check

# 仅做 PR 构建校验（push 到 dev 由 deploy.yml 负责构建并发布，避免重复构建）。
# 不影响从 VuePress 回退：deploy.yml 保留了一键切回的注释。

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build (VitePress)
        run: pnpm docs:build:vp
